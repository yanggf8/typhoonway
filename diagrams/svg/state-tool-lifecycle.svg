 data-node="true" data-id="deleted----note-12" transform="translate(1523.21484375, 442.5)"><rect x="-105.3203125" y="-61.5" width="210.640625" height="123"/><g class="label" style="" transform="translate(-97.8203125, -54)"><rect/><foreignObject width="195.640625" height="108"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">Row retained for lineage<br />        and tool history; binary<br />        archived to .history/.<br />        purge is the irreversible<br />        terminal step that removes<br />        the row and clears .history/.</span></div></foreignObject></g></g><g class="node statediagram-note" id="state-root_start----note-13" data-node="true" data-id="root_start----note-13" transform="translate(188.7734375, 192.5)"><rect x="-145.7734375" y="-52.5" width="291.546875" height="105"/><g class="label" style="" transform="translate(-138.2734375, -45)"><rect/><foreignObject width="276.546875" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">Filesystem leftovers may persist<br />        if a process crashes during install.<br />        The DB registry row and checksum are<br />        source of truth; tool sync removes or<br />        surfaces mismatches out of band.</span></div></foreignObject></g></g></g></g></g></svg>