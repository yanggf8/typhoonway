ss="label" style="" transform="translate(-143.84375, -81)"><rect/><foreignObject width="287.6875" height="162"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">Side effects branch on kind.<br />        new: registry insert + tool.md + install.<br />        replace / extend: lineage update +<br />        tool.md + swap, predecessor to .history/.<br />        deprecate: registry status -&gt; disabled +<br />        archive binary; no tool.md, no install.<br />        All in one DB transaction; no memory<br />        write participates. Filesystem work<br />        follows the registry mutation protocol.</span></div></foreignObject></g></g><g class="node statediagram-note" id="state-rejected----note-11" data-node="true" data-id="rejected----note-11" transform="translate(1302.4375, 259.5)"><rect x="-119.1015625" y="-43.5" width="238.203125" height="87"/><g class="label" style="" transform="translate(-111.6015625, -36)"><rect/><foreignObject width="223.203125" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">Blacklist is a dream-side guard:<br />        count terminal rejected rows for<br />        the same pattern_key before<br />        drafting. Derived, not stored.</span></div></foreignObject></g></g></g></g></g></svg>